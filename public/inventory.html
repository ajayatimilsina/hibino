<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>棚卸</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/common.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container py-3">
    <div class="d-flex justify-content-between mb-2">
      <h4>棚卸（在庫管理）</h4>
      <button id="saveAll" class="btn btn-danger">入力済みの実数をすべて確定</button>
    </div>
    <p class="text-muted small">注文ごとに在庫は自動で減ります。在庫0で自動的に欠品、<span id="th">5</span>個未満で「残りわずか」を表示します。</p>
    <div class="table-responsive"><table class="table table-sm align-middle bg-white">
      <thead><tr><th>ID</th><th>商品</th><th>状態</th><th class="text-end">システム在庫</th><th style="width:130px">実数</th><th class="text-end">差異</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <h5 class="mt-4">棚卸履歴</h5>
    <table class="table table-sm bg-white"><thead><tr><th>日時</th><th>商品</th><th class="text-end">システム</th><th class="text-end">実数</th><th class="text-end">差異</th></tr></thead><tbody id="takes"></tbody></table>
  </div>
  <script type="module" src="js/inventory.js"></script>
</body>
</html>
