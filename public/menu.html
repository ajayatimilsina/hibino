<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メニュー管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/common.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container py-3">
    <div class="d-flex justify-content-between mb-2">
      <h4>メニュー管理</h4>
      <button id="addBtn" class="btn btn-danger">＋ 新規追加</button>
    </div>
    <div class="table-responsive"><table class="table table-sm align-middle bg-white">
      <thead><tr><th>ID</th><th>名前</th><th>カテゴリ</th><th class="text-end">価格</th><th>オプション</th><th>欠品</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><form class="modal-content" id="form">
      <div class="modal-header"><h5 class="modal-title" id="formTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-2">
          <div class="col-4"><label class="form-label small">ID</label><input id="fId" type="number" min="1" class="form-control" required></div>
          <div class="col-8"><label class="form-label small">名前</label><input id="fName" class="form-control" maxlength="80" required></div>
          <div class="col-6"><label class="form-label small">カテゴリ</label><input id="fCat" class="form-control" list="cats" maxlength="30" required><datalist id="cats"></datalist></div>
          <div class="col-3"><label class="form-label small">価格 (¥)</label><input id="fPrice" type="number" min="0" class="form-control" required></div>
          <div class="col-3"><label class="form-label small">在庫</label><input id="fStock" type="number" min="0" class="form-control" required></div>
        </div>
        <div class="form-check form-switch mt-3"><input class="form-check-input" type="checkbox" id="fSold"><label class="form-check-label" for="fSold">欠品</label></div>
        <hr>
        <div class="d-flex justify-content-between align-items-center mb-2"><strong>オプション（名前 / 追加料金）</strong>
          <button type="button" id="addOpt" class="btn btn-sm btn-outline-secondary">+ OPTION</button></div>
        <div id="opts"></div>
      </div>
      <div class="modal-footer"><button class="btn btn-danger">保存</button></div>
    </form></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
