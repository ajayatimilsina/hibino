<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キッチン (KDS)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/common.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body class="kds">
  <div id="nav"></div>
  <div class="p-2 d-flex flex-wrap gap-2 align-items-center" style="background:#26262c">
    <button id="audioBtn" class="btn btn-warning fw-bold">🔊 音声を有効にする</button>
    <button class="btn btn-outline-light" data-say="いらっしゃいませ">いらっしゃいませ</button>
    <button class="btn btn-outline-light" data-say="ありがとうございました">ありがとうございました</button>
    <div class="form-check text-light mb-0">
      <input class="form-check-input" type="checkbox" id="showCust"><label class="form-check-label" for="showCust">お客様画面にも表示</label>
    </div>
    <span class="ms-auto d-flex flex-wrap gap-2 align-items-center text-light small">
      <div class="form-check mb-0"><input class="form-check-input" type="checkbox" id="autoPrint" checked><label class="form-check-label" for="autoPrint">自動印刷</label></div>
      <select id="printMode" class="form-select form-select-sm w-auto"><option value="browser">ブラウザ印刷</option><option value="escpos">ESC/POS</option></select>
      <select id="paper" class="form-select form-select-sm w-auto"><option value="80">80mm</option><option value="58">58mm</option></select>
    </span>
  </div>
  <div class="p-2"><div id="grid" class="row g-2"></div><div id="empty" class="text-center text-secondary mt-5 fs-4">新規注文はありません</div></div>
  <div id="printArea"></div>
  <script type="module" src="js/kds.js"></script>
</body>
</html>
